name: Website

# Publishes the landing page in site/ to GitHub Pages (https://mavr1k.github.io/LangCycle/).
# One-time setup: Settings -> Pages -> Source: "GitHub Actions". This is not part of app releases: the Release
# workflow only reacts to changes in Sources/, Resources/, Package.swift and build.sh.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
