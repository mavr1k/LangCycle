name: Release

# Builds the app, creates a GitHub release with the zip, and updates the Homebrew cask in mavr1k/homebrew-tap.
#
# - Every push to main that changes the app (the paths below) releases the next version automatically:
#   v1.1 -> v1.1.1 -> v1.1.2 ... Raising the version in Resources/Info.plist above the latest tag starts a new
#   line instead (see next-version.sh). The version is stamped into the build; nothing is committed back.
# - Put [skip release] in the last commit message of a push to skip the release.
# - Pushing a tag like v2.0 by hand releases exactly that version.
# - Running it by hand from the Actions tab is a dry run: it builds and checks everything, keeps the files as a
#   workflow artifact, and publishes nothing.
on:
  push:
    branches: [main]
    paths: ["Sources/**", "Resources/**", "Package.swift", "build.sh"] # not evaluated for tag pushes
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release # one release at a time; of several waiting pushes only the newest runs, and it includes the others' commits
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # to create the release and its tag
    env:
      # Fine-grained token with "Contents: read and write" on mavr1k/homebrew-tap only (see README, "Releasing").
      # Without it the release is still created and the cask update is skipped with a notice.
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history: for the next version, the build number and the release notes

      - name: Decide the version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            plist="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)"
            latest="$(git tag --list 'v*' | sort -V | tail -n 1)"
            version="$(./next-version.sh "$latest" "$plist")"
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::'$version' is not a version like 1.2 or 1.2.3. Tags must look like v1.2 or v1.2.3."
            exit 1
          fi
          build="$(git rev-list --count HEAD)"
          echo "LANGCYCLE_VERSION=$version" >> "$GITHUB_ENV"
          echo "LANGCYCLE_BUILD=$build" >> "$GITHUB_ENV"
          echo "Releasing v$version (build $build) from $GITHUB_SHA"

      - name: Unit tests
        run: ./test.sh

      - name: Build and check the release files
        run: ./release.sh # picks up LANGCYCLE_VERSION and LANGCYCLE_BUILD

      - name: Keep the release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/*.zip
            dist/langcycle.rb
          retention-days: 14

      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$LANGCYCLE_VERSION"
          # A tag push can come after the release was already made (nothing to do then).
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::The release $tag already exists, so nothing was published."
            exit 0
          fi
          ./release-notes.sh "$tag" "$GITHUB_SHA" > dist/release-notes.md
          # Creates the tag at this commit if it does not exist yet.
          gh release create "$tag" "dist/LangCycle-$LANGCYCLE_VERSION.zip" \
            --target "$GITHUB_SHA" --title "LangCycle $LANGCYCLE_VERSION" --notes-file dist/release-notes.md
          echo "PUBLISHED=true" >> "$GITHUB_ENV"

      # Only after the release exists, so the cask never points at a file that is not there yet.
      - name: Check out the Homebrew tap
        if: env.PUBLISHED == 'true' && env.TAP_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: mavr1k/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update the Homebrew cask
        if: env.PUBLISHED == 'true' && env.TAP_TOKEN != ''
        run: |
          cp dist/langcycle.rb tap/Casks/langcycle.rb
          cd tap
          if git diff --quiet; then
            echo "The cask is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update langcycle to $LANGCYCLE_VERSION"
          git push

      - name: Note that the cask was not updated
        if: env.PUBLISHED == 'true' && env.TAP_TOKEN == ''
        run: echo "::notice::The secret TAP_GITHUB_TOKEN is not set, so the Homebrew cask was not updated. Copy dist/langcycle.rb from the release-files artifact into the tap by hand."
